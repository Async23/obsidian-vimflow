name: Release
on:
  push:
    tags: ["[0-9]*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Verify release version
        run: node scripts/verify-release.mjs
      - name: Publish plugin files
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --verify-tag --title "Vimflow $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
